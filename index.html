<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrambled Browser</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #fdfdfd;
      text-align: center;
    }
    header {
      background-color: #222;
      color: white;
      padding: 15px;
      font-size: 24px;
    }
    .input-bar {
      margin: 20px;
    }
    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 300px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    input[type="submit"] {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #222;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }
  </style>
</head>
<body>
  <header>Scrambled Browser</header>

  <div class="input-bar">
    <form onsubmit="decodeAndLoad(event)">
      <input type="text" id="scrambled" placeholder="Enter scrambled URL..." required />
      <input type="submit" value="Go" />
    </form>
  </div>

  <iframe id="browserFrame" src=""></iframe>

  <script>
    function decodeAndLoad(event) {
      event.preventDefault();
      const input = document.getElementById("scrambled").value;

      // Example: decode using Base64 (you can change this to ROT13 or custom logic)
      try {
        const decoded = atob(input);
        document.getElementById("browserFrame").src = decoded;
      } catch (e) {
        alert("Invalid scrambled URL. Make sure it's Base64 encoded.");
      }
    }
  </script>
</body>
</html>
