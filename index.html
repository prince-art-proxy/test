<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom DuckDuckGo Site Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafef5;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #de5833;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="search"] {
      padding: 10px;
      font-size: 16px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="submit"] {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #de5833;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #c94c2e;
    }
  </style>
</head>
<body>
  <h1>Search My Site with DuckDuckGo</h1>
  <form
    action="https://duckduckgo.com"
    method="get"
    target="_blank"
    rel="noopener"
    onsubmit="this.k7.value = getComputedStyle(document.documentElement).backgroundColor"
  >
    <!-- Search query -->
    <input
      type="search"
      name="q"
      aria-label="Search via DuckDuckGo"
      placeholder="Search oliverjam.com"
      required
    />

    <!-- DuckDuckGo customization parameters -->
    <input type="hidden" name="sites" value="oliverjam.com" />
    <input type="hidden" name="ko" value="-2" /> <!-- Remove header -->
    <input type="hidden" name="k1" value="-1" /> <!-- Remove ads -->
    <input type="hidden" name="kz" value="-1" /> <!-- Remove related searches -->
    <input type="hidden" name="km" value="m" />  <!-- Center results -->
    <input type="hidden" name="k7" value="#fafef5" /> <!-- Background color -->

    <!-- Submit button -->
    <input type="submit" value="Search" />
  </form>
</body>
</html>
