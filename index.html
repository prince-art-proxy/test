    function decodeBase64(encoded) {
      try {
        return atob(encoded);
      } catch (e) {
        console.error("Invalid Base64:", e);
        return "";
      }
    }

    function setIframe() {
      const encodedUrl = sessionStorage.getItem("encodedUrl");
      if (encodedUrl) {
        const decodedUrl = decodeBase64(encodedUrl);
        console.log("Decoded URL:", decodedUrl);
        document.getElementById("website").src = decodedUrl;
      }
    }

    setIframe();
  </script>
