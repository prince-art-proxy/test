<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Tools</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://cdn.jsdelivr.net/gh/sealiee11/randomluminalshii@main/background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #4a90e2;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
      background-color: #357ABD;
    }
  </style>
</head>
<body>
  <h1>Welcome to Study Tools</h1>
  <p>Click below to launch a game:</p>
  <button onclick="launchGame()">Play Game</button>

  <script>
    function launchGame() {
      const gameUrl = "https://cdn.jsdelivr.net/gh/yourusername/yourrepo@main/game.html"; // Replace with your actual game URL
      window.open(gameUrl, "_blank");
    }
  </script>
</body>
</html>
