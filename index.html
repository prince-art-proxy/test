<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Custom Browser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fdfdfd;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #222;
      color: white;
      padding: 15px;
      font-size: 24px;
    }
    .logo {
      margin: 20px;
    }
    .search-bar {
      margin: 20px;
    }
    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 300px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    input[type="submit"] {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #222;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #444;
    }
    .icons {
      margin: 20px;
    }
    .icons img {
      width: 32px;
      margin: 0 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>My Custom Browser</header>

  <div class="logo">
    <img src="https://nsd160.org/stuff/logo.png" alt="Logo" width="100" />
  </div>

  <div class="search-bar">
    <form
      action="https://duckduckgo.com"
      method="get"
      target="_blank"
      rel="noopener"
      onsubmit="this.k7.value = getComputedStyle(document.documentElement).backgroundColor"
    >
      <input type="text" name="q" placeholder="Search the web..." required />
      <input type="hidden" name="ko" value="-2" />
      <input type="hidden" name="k1" value="-1" />
      <input type="hidden" name="kz" value="-1" />
      <input type="hidden" name="km" value="m" />
      <input type="hidden" name="k7" value="#fdfdfd" />
      <input type="submit" value="Search" />
    </form>
  </div>

  <div class="icons">
    <img src="https://nsd160.org/stuff/icons/back.svg" alt="Back" title="Back" onclick="history.back()" />
    <img src="https://nsd160.org/stuff/icons/forward.svg" alt="Forward" title="Forward" onclick="history.forward()" />
    <img src="https://nsd160.org/stuff/icons/reload.svg" alt="Reload" title="Reload" onclick="location.reload()" />
  </div>
</body>
</html>
