<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuckDuckGo Browser</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }
    header {
      background-color: #de5833;
      color: white;
      padding: 10px 20px;
      text-align: center;
      font-size: 24px;
    }
    iframe {
      width: 100%;
      height: calc(100% - 60px);
      border: none;
    }
  </style>
</head>
<body>
  <header>DuckDuckGo Browser</header>
  <iframe src="https://duckduckgo.com"></iframe>
</body>
</html>
